    <main>

    <!-- Title -->
    <div id="title">Neuigkeiten</div>

    <!-- Container -->
    <div id="container"></div>

    <script>
      fetch("./data/news-images.json")
        .then(function(r) { return r.json(); })
        .then(function(groups) {
          var container = document.getElementById("container");
          var fragment = document.createDocumentFragment();
          groups.forEach(function(group) {
            var groupEl = document.createElement("div");
            groupEl.className = "group";

            var titleEl = document.createElement("div");
            titleEl.className = "group-title";
            var spanEl = document.createElement("span");
            spanEl.textContent = group.title;
            titleEl.appendChild(spanEl);
            groupEl.appendChild(titleEl);

            var contentEl = document.createElement("div");
            contentEl.className = "group-content";

            var enabledImages = group.images.filter(function(img) { return !img.disabled; });
            enabledImages.forEach(function(img, imgIndex) {
              var containerEl = document.createElement("div");
              containerEl.className = "gallery-image-container lb-trigger";
              var el = document.createElement("img");
              el.src = img.medium;
              el.srcset = img.thumb + " 160w, " + img.medium + " 500w, " + img.full + " 1920w";
              el.sizes = "(max-width: 600px) 100vw, (max-width: 900px) 50vw, 33vw";
              el.className = "gallery-image";
              el.loading = "lazy";
              el.width = 300;
              el.height = 400;
              containerEl.appendChild(el);
              containerEl.addEventListener("click", function() {
                lightbox.open(enabledImages, imgIndex);
              });
              contentEl.appendChild(containerEl);
            });

            groupEl.appendChild(contentEl);
            fragment.appendChild(groupEl);
          });
          container.appendChild(fragment);

          fjGallery(
            document.querySelectorAll(
              "div#container > div.group > div.group-content"
            ),
            {
              itemSelector:
                "div#container > div.group > div.group-content > div.gallery-image-container",
            }
          );
        });
    </script>
